<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark" data-lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TURKI | Director of Photography</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=JetBrains+Mono:wght@300;400;700;800&family=Syne:wght@400;600;700;800&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <style>
    [data-theme="dark"]{--bg:#050710;--bg-soft:#101728;--panel:rgba(7,11,19,.9);--line:rgba(228,217,192,.12);--text:#e4d9c0;--muted:rgba(228,217,192,.66);--accent:#c9a84c;--frame:#0e1629;--film:#efe3c7;--perf:#050710}
    [data-theme="light"]{--bg:#f7f1e7;--bg-soft:#ebe2d6;--panel:rgba(255,255,255,.82);--line:rgba(24,24,36,.1);--text:#111729;--muted:rgba(17,23,41,.68);--accent:#9e7c2e;--frame:#1d2845;--film:#1d2845;--perf:#f7f1e7}
    [data-lang="ar"]{direction:rtl;font-family:'Tajawal','JetBrains Mono',sans-serif}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at top,var(--bg-soft),var(--bg));color:var(--text);font-family:'JetBrains Mono',monospace}
    img,video{max-width:100%;display:block}button,input,textarea,select{font:inherit}
    .ambient-bg,.grain,.scanlines{position:fixed;inset:0;pointer-events:none}.ambient-bg{z-index:-3;background:radial-gradient(circle at 10% 10%,rgba(201,168,76,.08),transparent 30%),radial-gradient(circle at 90% 80%,rgba(212,48,61,.05),transparent 28%)}.grain{z-index:-2;opacity:.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3'/%3E%3C/filter%3E%3Crect width='200' height='200' filter='url(%23n)'/%3E%3C/svg%3E")}.scanlines{z-index:-1;opacity:.04;background:repeating-linear-gradient(180deg,transparent 0 3px,rgba(255,255,255,.02) 3px 4px)}
    .top-bar{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:20px 5vw;z-index:100;background:linear-gradient(180deg,rgba(5,7,16,.85),transparent);backdrop-filter:blur(10px)}.top-bar.scrolled{background:rgba(5,7,16,.92)}
    .brand-wrap{display:flex;align-items:center;gap:14px}.brand-logo{width:56px;height:56px;border-radius:14px;border:1px solid var(--line);padding:8px;background:rgba(255,255,255,.04)}.brand-mark{font-family:'Syne',sans-serif;letter-spacing:.18em;font-size:.82rem;font-weight:700}
    .nav-right{display:flex;align-items:center;gap:18px}.nav-links{display:flex;gap:24px}.nav-links a{color:var(--muted);text-decoration:none;text-transform:uppercase;letter-spacing:2px;font-size:.72rem}.nav-links a:hover{color:var(--text)}.nav-toggle{width:38px;height:38px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--text);cursor:pointer}
    .hero{min-height:100vh;display:grid;align-items:center;padding:120px 5vw 80px}.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:7vw;max-width:1480px;width:100%;margin:0 auto}.role-badge{display:inline-flex;align-items:center;gap:12px;color:var(--accent);letter-spacing:5px;font-size:.68rem}.role-badge::before{content:'';width:48px;height:1px;background:linear-gradient(90deg,transparent,var(--accent))}.bio-content h1{font-family:'Syne',sans-serif;font-size:clamp(3rem,8vw,7rem);line-height:.84;margin:20px 0;background:linear-gradient(180deg,var(--text),rgba(228,217,192,.45));-webkit-background-clip:text;-webkit-text-fill-color:transparent}.hero-summary{font-family:'Cormorant Garamond',serif;font-size:1.35rem;color:var(--muted);max-width:620px;line-height:1.7}.hero-subtitle{margin:20px 0 34px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;font-size:.8rem}.cta-row{display:flex;gap:16px;flex-wrap:wrap}.cta-btn,.ghost-btn{padding:16px 28px;border:1px solid var(--line);background:var(--text);color:var(--bg);cursor:pointer;text-transform:uppercase;letter-spacing:2px;font-size:.72rem}.ghost-btn{background:transparent;color:var(--text)}
    .viewfinder-wrapper{padding:24px;border:1px solid var(--line);border-radius:26px;background:var(--panel);box-shadow:0 30px 80px rgba(0,0,0,.3)}.camera-body{background:linear-gradient(145deg,#0a0d14,#040508);padding:22px;border-radius:20px}.lcd-screen{position:relative;overflow:hidden;border-radius:18px;background:#000;aspect-ratio:4/5}.lcd-screen img,.lcd-screen video{width:100%;height:100%;object-fit:cover}.hud{position:absolute;padding:8px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.35);font-size:.62rem;letter-spacing:1.5px}.hud-tl{top:12px;left:12px}.hud-tr{top:12px;right:12px}.hud-bl{left:12px;bottom:12px}.hud-br{right:12px;bottom:12px}.rec-dot{width:8px;height:8px;border-radius:50%;background:#d4303d;display:inline-block;margin-right:8px}.crosshair{position:absolute;inset:50% auto auto 50%;width:52px;height:52px;transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.22);border-radius:50%}.camera-specs{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.camera-specs span{padding:8px 12px;border:1px solid var(--line);border-radius:999px;font-size:.68rem;color:var(--muted)}
    .section-shell{padding:0 5vw 70px;max-width:1480px;margin:0 auto}.section-title{font-family:'Syne',sans-serif;font-size:clamp(2rem,5vw,4rem)}.section-kicker{max-width:720px;color:var(--muted);margin:8px 0 32px}.reel-block{margin-bottom:40px}.reel-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px}.reel-title{font-family:'Syne',sans-serif;font-size:clamp(1.5rem,3vw,2.4rem)}.reel-desc{font-family:'Cormorant Garamond',serif;color:var(--muted);font-size:1.1rem}
    .film-strip{background:var(--film);padding:46px 0 62px;position:relative;overflow:hidden;border-radius:24px}.film-strip::before,.film-strip::after{content:'';position:absolute;left:0;width:100%;height:18px;background-image:repeating-linear-gradient(to right,var(--perf) 0,var(--perf) 22px,transparent 22px,transparent 38px)}.film-strip::before{top:12px}.film-strip::after{bottom:12px}.reel-track{display:flex;gap:14px;padding:0 24px;width:max-content;animation:drift 26s linear infinite}.frame{border:2px solid var(--frame);background:#000;cursor:pointer;aspect-ratio:16/10;flex:0 0 min(320px,72vw);padding:0;position:relative;overflow:hidden;color:inherit}.frame img,.frame video{width:100%;height:100%;object-fit:cover}.frame-caption{position:absolute;left:0;right:0;bottom:0;padding:18px 14px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.86));display:flex;flex-direction:column;align-items:flex-start}.frame-caption strong{font-family:'Syne',sans-serif;color:#fff}.frame-caption span{font-family:'Cormorant Garamond',serif;color:rgba(255,255,255,.82)}.media-type{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.72);color:#c9a84c;border:1px solid rgba(201,168,76,.3);padding:4px 10px;font-size:.58rem;letter-spacing:2px}
    .footer-section{padding:20px 5vw 80px;display:grid;grid-template-columns:1fr 1fr;gap:7vw;max-width:1480px;margin:0 auto;border-top:1px solid var(--line)}.footer-section h3{font-family:'Syne',sans-serif;font-size:2.5rem;margin:0 0 20px}.cred-list{list-style:none;padding:0;margin:0}.cred-list li,.contact-links a{display:flex;justify-content:space-between;gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}.cred-title{font-family:'Cormorant Garamond',serif;font-size:1.15rem}.cred-title.has-image{cursor:pointer}.cred-year{color:var(--muted);font-size:.74rem;letter-spacing:1px}.contact-links{display:flex;flex-direction:column}.contact-links a{text-decoration:none;color:var(--text)}.contact-links a span:last-child{color:var(--accent)}.empty-card,.empty-row{padding:18px;border:1px dashed var(--line);border-radius:18px;color:var(--muted);background:rgba(255,255,255,.03)}
    .copyright{text-align:center;padding:0 5vw 40px;color:var(--muted);letter-spacing:2px;font-size:.68rem;text-transform:uppercase}.load-state{padding:8px 5vw 0;color:var(--accent);font-size:.78rem}
    #lightbox{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,7,16,.94);backdrop-filter:blur(20px);opacity:0;pointer-events:none;transition:opacity .25s}.active#lightbox{opacity:1;pointer-events:auto}#lightbox-inner{width:min(1100px,92vw)}#lightbox-content{background:#000;border:1px solid var(--line);border-radius:18px;overflow:hidden}#lightbox-content img,#lightbox-content video{width:100%;max-height:78vh;object-fit:contain}.close-lb{position:absolute;top:20px;right:24px;padding:10px 18px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer}.lb-meta{margin-top:12px}.lb-meta h4{font-family:'Syne',sans-serif;margin:0 0 6px}.lb-meta p{margin:0;color:var(--muted);font-family:'Cormorant Garamond',serif;font-size:1.1rem}
    @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}@media(max-width:960px){.hero-grid,.footer-section{grid-template-columns:1fr}.nav-links{display:none}}@media(max-width:640px){.cta-row{flex-direction:column}.cta-btn,.ghost-btn{width:100%}}
  </style>
</head>
<body>
  <div class="ambient-bg"></div>
  <div class="grain"></div>
  <div class="scanlines"></div>

  <nav class="top-bar" id="topBar">
    <div class="brand-wrap">
      <img class="brand-logo" id="brandLogo" src="assets/uploads/brand/default-logo.svg" alt="Logo">
      <div class="brand-mark" id="brandMark">TB VISUALS</div>
    </div>
    <div class="nav-right">
      <div class="nav-links">
        <a href="#work" data-en="Portfolio" data-ar="المعرض">Portfolio</a>
        <a href="#credentials" data-en="Credentials" data-ar="الاعتمادات">Credentials</a>
        <a href="#contact" data-en="Contact" data-ar="تواصل">Contact</a>
      </div>
      <button class="nav-toggle" id="langToggle" type="button">AR</button>
      <button class="nav-toggle" id="themeToggle" type="button">☀️</button>
    </div>
  </nav>

  <section class="hero">
    <div class="hero-grid">
      <div class="bio-content">
        <div class="role-badge" id="heroRole">DIRECTOR OF PHOTOGRAPHY</div>
        <h1 id="heroName">TURKI</h1>
        <p class="hero-summary" id="heroSummary"></p>
        <div class="hero-subtitle" id="heroSubtitle"></div>
        <div class="cta-row">
          <button class="cta-btn" id="ctaPortfolio" type="button" onclick="document.getElementById('work').scrollIntoView({behavior:'smooth'})">Access Portfolio ↓</button>
          <button class="ghost-btn" id="ctaBook" type="button" onclick="document.getElementById('contact').scrollIntoView({behavior:'smooth'})">Book Now</button>
        </div>
      </div>
      <div class="viewfinder-wrapper">
        <div class="camera-body">
          <div class="lcd-screen" id="heroMediaWrap"></div>
          <div class="camera-specs" id="heroSpecs"></div>
        </div>
      </div>
    </div>
  </section>

  <p class="load-state" id="loadState"></p>

  <section id="work" class="section-shell">
    <h2 class="section-title" id="portfolioTitle"></h2>
    <div class="section-kicker" id="portfolioDesc"></div>
    <div id="reelsContainer"></div>
  </section>

  <section class="footer-section" id="credentials">
    <div>
      <h3 id="credentialsTitle"></h3>
      <ul class="cred-list" id="credentialsList"></ul>
    </div>
    <div id="contact">
      <h3 id="contactTitle"></h3>
      <div class="contact-links" id="contactLinks"></div>
    </div>
  </section>

  <div class="copyright" id="copyright"></div>

  <div id="lightbox" onclick="closeLightbox(event)">
    <button class="close-lb" type="button" onclick="closeLightbox(event)">CLOSE ✕</button>
    <div id="lightbox-inner">
      <div id="lightbox-content"></div>
      <div class="lb-meta">
        <h4 id="lbTitle"></h4>
        <p id="lbDesc"></p>
      </div>
    </div>
  </div>

  <script type="module" src="./scripts/site.js"></script>
</body>
</html>
